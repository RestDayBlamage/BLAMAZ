    <!-- Ekran ładowania jak na polymer.ws: jasnoszare tło z bladym znakiem logo → tło przechodzi w ciepłą szarość
         (kolor spod zdjęć w hero), znak gaśnie → ekran znika, a zdjęcia „prześwietlają się” i startuje pisanie tekstów.
         Klasa is-loading dodawana skryptem, więc bez JavaScriptu ekran się nie pokaże. Kolory wpisane na sztywno
         (tokeny z global.css jeszcze nie działają) – lustro --c-bg i --c-stone. Sterowanie: src/utils/preloader.js -->
    <script>document.documentElement.classList.add('is-loading')</script>
    <style>
      html.is-loading, html.is-loading body { overflow: hidden; }
      #preloader { display: none; }
      html.is-loading #preloader, #preloader.is-done { display: grid; place-items: center; position: fixed; inset: 0; z-index: 100000; }
      #preloader { background: #f0f0f0; transition: background-color 0.5s ease, opacity 0.4s ease; }
      .pl-logo { width: min(40vw, 220px); height: auto; filter: brightness(0); opacity: 0.07; transition: opacity 0.5s ease; }
      .pl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      #preloader.is-done { background: #9b9793; pointer-events: none; }
      #preloader.is-done .pl-logo { opacity: 0; }
      #preloader.is-out { opacity: 0; }
    </style>
